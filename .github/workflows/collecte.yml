name: Collecte et publication

# Toutes les 6 heures : télécharge les données Grepolis, refait le site et le publie
# sur GitHub Pages. Rien n'est enregistré dans le dépôt (il reste léger).
on:
  schedule:
    # Les données Grepolis sont rafraîchies chaque heure : ne pas descendre sous 1 h.
    - cron: "17 */6 * * *"
  workflow_dispatch:      # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]      # et à chaque modification envoyée (config, page...)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Collecte et calculs
        run: Rscript collecte.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
